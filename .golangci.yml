# golangci-lint configuration.
# Run with: make lint
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  default: none
  enable:
    - errcheck      # unchecked errors
    - errorlint     # errors.Is / %w correctness
    - govet         # stdlib vet checks
    - ineffassign   # ineffectual assignments
    - staticcheck   # stdlib style + correctness
    - unused        # unused symbols
    - gosec         # security smells
    - contextcheck  # context.Context propagation

  exclusions:
    rules:
      # Tests can ignore unchecked errors and security warnings.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
